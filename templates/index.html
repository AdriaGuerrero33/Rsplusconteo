<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RS Plus — Verificador de Reseñas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #4f46e5;
    }

    button#btn-check {
      padding: 12px 24px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    button#btn-check:hover { background: #4338ca; }
    button#btn-check:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Contadores */
    .counters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .counter-box {
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .counter-box.total  { background: #f3f4f6; }
    .counter-box.active { background: #ecfdf5; }
    .counter-box.deleted{ background: #fef2f2; }
    .counter-box.error  { background: #fffbeb; }

    .counter-num {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }

    .counter-box.total   .counter-num { color: #374151; }
    .counter-box.active  .counter-num { color: #059669; }
    .counter-box.deleted .counter-num { color: #dc2626; }
    .counter-box.error   .counter-num { color: #d97706; }

    .counter-label {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .counter-box.total   .counter-label { color: #6b7280; }
    .counter-box.active  .counter-label { color: #065f46; }
    .counter-box.deleted .counter-label { color: #991b1b; }
    .counter-box.error   .counter-label { color: #92400e; }

    /* Barra de progreso */
    .progress-section { display: none; }
    .progress-section.visible { display: block; }

    .progress-bar-track {
      background: #e5e7eb;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      border-radius: 999px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .progress-label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 20px;
    }

    /* Log */
    .log-title {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .log-box {
      background: #0f172a;
      border-radius: 10px;
      padding: 16px;
      height: 220px;
      overflow-y: auto;
      font-family: "Menlo", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .log-line { display: flex; gap: 8px; }
    .log-icon { flex-shrink: 0; }
    .log-text { color: #94a3b8; word-break: break-all; }
    .log-line.activa   .log-text { color: #34d399; }
    .log-line.eliminada .log-text { color: #f87171; }
    .log-line.error    .log-text { color: #fbbf24; }
    .log-line.info     .log-text { color: #60a5fa; }

    /* Resultado final */
    .result-card {
      display: none;
      background: #f0fdf4;
      border: 2px solid #bbf7d0;
      border-radius: 12px;
      padding: 20px 24px;
    }

    .result-card.visible { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .result-card.error-card { background: #fef2f2; border-color: #fecaca; }

    .result-text { font-size: 14px; color: #166534; font-weight: 500; }
    .result-card.error-card .result-text { color: #991b1b; }

    .btn-sheet {
      padding: 10px 18px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-sheet:hover { background: #047857; }

    @media (max-width: 500px) {
      .counters { grid-template-columns: repeat(2, 1fr); }
      .input-row { flex-direction: column; }
      .result-card.visible { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Cabecera -->
  <div class="card">
    <h1>Verificador de Reseñas Google</h1>
    <p class="subtitle">Pega el enlace de tu hoja de Google Sheets y comprueba cuántas reseñas siguen activas.</p>

    <div class="input-row">
      <input type="text" id="sheet-url" placeholder="https://docs.google.com/spreadsheets/d/..." />
      <button id="btn-check" onclick="startCheck()">Comprobar</button>
    </div>
  </div>

  <!-- Contadores -->
  <div class="card">
    <div class="counters">
      <div class="counter-box total">
        <div class="counter-num" id="cnt-total">—</div>
        <div class="counter-label">Total</div>
      </div>
      <div class="counter-box active">
        <div class="counter-num" id="cnt-activas">—</div>
        <div class="counter-label">Activas</div>
      </div>
      <div class="counter-box deleted">
        <div class="counter-num" id="cnt-eliminadas">—</div>
        <div class="counter-label">Eliminadas</div>
      </div>
      <div class="counter-box error">
        <div class="counter-num" id="cnt-errores">—</div>
        <div class="counter-label">Errores</div>
      </div>
    </div>

    <!-- Barra de progreso -->
    <div class="progress-section" id="progress-section">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div class="progress-label" id="progress-label">Iniciando...</div>
      <div class="log-title">Registro en tiempo real</div>
      <div class="log-box" id="log-box"></div>
    </div>
  </div>

  <!-- Resultado final -->
  <div class="result-card" id="result-card">
    <span class="result-text" id="result-text"></span>
    <a class="btn-sheet" id="result-link" href="#" target="_blank">Ver en Google Sheets →</a>
  </div>

</div>

<script>
  let eventSource = null;

  function startCheck() {
    const url = document.getElementById("sheet-url").value.trim();
    if (!url) {
      alert("Por favor, pega la URL de tu hoja de Google Sheets.");
      return;
    }

    // Reset UI
    resetUI();
    document.getElementById("btn-check").disabled = true;
    document.getElementById("progress-section").classList.add("visible");
    document.getElementById("result-card").classList.remove("visible", "error-card");

    if (eventSource) eventSource.close();

    eventSource = new EventSource(`/check?sheet_url=${encodeURIComponent(url)}`);

    eventSource.onmessage = (e) => {
      const data = JSON.parse(e.data);
      handleEvent(data);
    };

    eventSource.onerror = () => {
      addLog("error", "⚠", "Conexión interrumpida con el servidor.");
      document.getElementById("btn-check").disabled = false;
      eventSource.close();
    };
  }

  function handleEvent(data) {
    switch (data.type) {
      case "status":
        addLog("info", "ℹ", data.message);
        document.getElementById("progress-label").textContent = data.message;
        break;

      case "total":
        document.getElementById("cnt-total").textContent = data.total;
        document.getElementById("cnt-activas").textContent = "0";
        document.getElementById("cnt-eliminadas").textContent = "0";
        document.getElementById("cnt-errores").textContent = "0";
        break;

      case "progress":
        updateCounters(data);
        updateProgress(data.current, data.total);
        const icon = data.status === "ACTIVA" ? "✓" : data.status === "ELIMINADA" ? "✗" : "?";
        addLog(data.status.toLowerCase(), icon, `[${data.current}/${data.total}] ${data.status} — ${data.url}`);
        break;

      case "done":
        updateCounters(data);
        updateProgress(data.total, data.total);
        document.getElementById("progress-label").textContent = "¡Verificación completada!";
        showResult(data);
        document.getElementById("btn-check").disabled = false;
        if (eventSource) eventSource.close();
        break;

      case "error":
        addLog("error", "✗", data.message);
        document.getElementById("progress-label").textContent = "Error: " + data.message;
        showError(data.message);
        document.getElementById("btn-check").disabled = false;
        if (eventSource) eventSource.close();
        break;
    }
  }

  function updateCounters(data) {
    if (data.total !== undefined) document.getElementById("cnt-total").textContent = data.total;
    if (data.activas !== undefined) document.getElementById("cnt-activas").textContent = data.activas;
    if (data.eliminadas !== undefined) document.getElementById("cnt-eliminadas").textContent = data.eliminadas;
    if (data.errores !== undefined) document.getElementById("cnt-errores").textContent = data.errores;
  }

  function updateProgress(current, total) {
    const pct = total > 0 ? Math.round((current / total) * 100) : 0;
    document.getElementById("progress-bar").style.width = pct + "%";
    document.getElementById("progress-label").textContent = `Verificando... ${current} de ${total} (${pct}%)`;
  }

  function addLog(type, icon, text) {
    const box = document.getElementById("log-box");
    const line = document.createElement("div");
    line.className = `log-line ${type}`;
    line.innerHTML = `<span class="log-icon">${icon}</span><span class="log-text">${escapeHtml(text)}</span>`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function showResult(data) {
    const card = document.getElementById("result-card");
    card.classList.add("visible");
    document.getElementById("result-text").textContent =
      `Listo. ${data.activas} activas · ${data.eliminadas} eliminadas · ${data.errores} errores. Resultados guardados en la pestaña "${data.results_tab}".`;
    const link = document.getElementById("result-link");
    link.href = data.sheet_url;
  }

  function showError(message) {
    const card = document.getElementById("result-card");
    card.classList.add("visible", "error-card");
    document.getElementById("result-text").textContent = "Error: " + message;
    document.getElementById("result-link").style.display = "none";
  }

  function resetUI() {
    document.getElementById("cnt-total").textContent = "—";
    document.getElementById("cnt-activas").textContent = "—";
    document.getElementById("cnt-eliminadas").textContent = "—";
    document.getElementById("cnt-errores").textContent = "—";
    document.getElementById("log-box").innerHTML = "";
    document.getElementById("progress-bar").style.width = "0%";
    document.getElementById("progress-label").textContent = "Iniciando...";
    document.getElementById("result-link").style.display = "";
  }

  function escapeHtml(text) {
    return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
</script>
</body>
</html>
